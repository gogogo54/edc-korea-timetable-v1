<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EDC KOREA 2026 Timetable</title>
<style>
:root{--bg:#1a0f2e;--dim:#2a2740;--tx:#fff;--mu:#9b97b8}
*{box-sizing:border-box;margin:0}
body{background:linear-gradient(#4a1a5c,#1a0f2e 40%,#14102a);color:var(--tx);font-family:-apple-system,"Pretendard","Noto Sans KR",sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 10px calc(env(safe-area-inset-bottom) + 20px)}
h1{text-align:center;font-size:30px;font-weight:900;margin-top:24px;background:linear-gradient(90deg,#ffd23f,#ff5c8a,#b57cff);-webkit-background-clip:text;color:transparent}
.sub{text-align:center;font-weight:800;font-size:18px;margin-top:6px}
.cnt{text-align:center;color:var(--mu);font-size:13px;margin:4px 0 14px;letter-spacing:.5px}
.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:12px}
.tabs button{background:#ffffff18;color:#fff;border:0;border-radius:99px;padding:6px 14px;font-size:13px}
.tabs button.on{background:#ff5c8a}
.wrap{overflow-x:auto}
.tt{display:grid;grid-template-columns:34px repeat(5,minmax(70px,1fr));gap:4px;min-width:340px}
.hd{text-align:center;font-size:10px;font-weight:700;color:var(--mu);padding-bottom:6px;border-bottom:3px solid var(--c)}
.hd b{display:block;font-size:12px;color:var(--c)}
.col{position:relative;height:calc(var(--H)*1px)}
.hr{position:absolute;left:0;font-size:10px;color:var(--mu);transform:translateY(-6px)}
.b{position:absolute;left:0;right:0;border-radius:6px;padding:4px 5px;font-size:10px;font-weight:800;background:var(--dim);color:#a9a5c6;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;border:1px solid #ffffff10;line-height:1.2}
.b i{font-style:normal;font-weight:600;font-size:9px;opacity:.8}
.b.sel{background:linear-gradient(160deg,var(--c),#0b0b2a 130%);color:#fff;border-color:var(--c);box-shadow:0 0 10px -2px var(--c)}
.b.conf{outline:2px solid #ff3b3b}
.panel{margin-top:18px;background:#ffffff10;border-radius:14px;padding:12px}
.panel h2{font-size:14px;margin-bottom:8px}
.it{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid #ffffff14;font-size:13px}
.it .t{color:var(--mu);width:92px;flex:none;font-size:12px}
.it .n{flex:1;font-weight:700}
.it .s{font-size:10px;color:var(--mu)}
.it a{color:#fff;background:#ffffff1c;border-radius:6px;padding:3px 7px;font-size:11px;text-decoration:none}
.warn{color:#ff7b7b;font-size:12px;margin-top:3px}
.empty{color:var(--mu);font-size:13px}
.act{display:flex;gap:8px;margin-top:10px}
.act button{flex:1;background:#ffffff18;border:0;color:#fff;border-radius:8px;padding:8px;font-size:12px}
</style>
</head>
<body>
<h1>EDC KOREA 2026</h1>
<div class="sub" id="day">SATURDAY · OCT 3</div>
<div class="cnt" id="cnt"></div>
<div class="tabs" id="tabs"></div>
<div class="wrap"><div class="tt" id="tt"></div></div>
<div class="panel">
  <h2>내 라인업</h2>
  <div id="list"></div>
  <div class="act"><button id="pre">기본 8명으로 설정</button><button id="clr">전체 해제</button></div>
</div>
<script>
// 스테이지: [id, 윗줄, 아랫줄, 색]
const STAGES=[["k","kinetic","FIELD","#ffc933"],["c","circuit","GROUNDS","#33d6ff"],["s","stereo","BLOOM","#ff4f9a"],["j","bionic","JUNGLE","#7dff3a"],["a","boombox","ART CAR","#b57cff"]];
// 아티스트: [시작, 종료, 이름]
const DAYS={
"10.3 토":{title:"SATURDAY · OCT 3",
preset:["JESSICA AUDIFFRED","OGUZ","DØMINA","R3HAB","ALLEYCVT","THE OUTLAW","ILLENIUM B2B DABIN","DJ SNAKE"],
k:[["17:00","18:00","HOHO ONE"],["18:00","19:00","SUNGYOO"],["19:00","20:00","MUZIE"],["20:00","21:00","KREAM"],["21:00","22:00","DIMENSION"],["22:00","23:07","R3HAB"],["23:12","00:27","SUBTRONICS"],["00:30","01:45","ILLENIUM B2B DABIN"],["01:45","03:00","DJ SNAKE"]],
c:[["17:00","18:15","ASHIKO"],["18:15","19:15","CHEEZ & YUKA"],["19:15","20:15","WAY2_X"],["20:15","21:15","JESSICA AUDIFFRED"],["21:15","22:15","WILLIAM BLACK"],["22:15","23:15","ALLEYCVT"],["23:15","00:15","THE OUTLAW"],["00:15","01:30","SVDDEN DEATH"],["01:30","03:00","SARA LANDRY"]],
s:[["17:00","18:00","AUREDE"],["18:00","19:00","SSOMBO"],["19:00","20:00","BASSKRAP"],["20:00","21:00","OGUZ"],["21:00","22:00","DØMINA"],["22:00","23:15","ANIME"],["23:15","00:30","BEN NICKY PRESENTS XTREME"],["00:30","01:45","BRENNAN HEART"],["01:45","03:00","COONE"]],
j:[["17:00","18:15","ONE1"],["18:15","19:30","DAVICO B3B DEMUK B3B DEPARTS"],["19:30","20:45","YUUKI YOSHIYAMA"],["20:45","22:00","IDEMI"],["22:00","23:15","33 BELOW"],["23:15","00:30","AYYBO"],["00:30","01:45","RIORDAN"],["01:45","03:00","WAX MOTIF"]],
a:[["17:00","18:15","HONGTON_E"],["18:15","19:30","MONSTER"],["19:30","20:45","LOCO SOOUND"],["20:45","22:00","BETTER"],["22:00","23:15","SPACE COWBOY"],["23:15","00:30","MUZIE"],["00:30","01:45","ROM&BAAWLA"],["01:45","03:00","SIM + PINO"]]},
"10.4 일":{title:"SUNDAY · OCT 4",preset:[]} // 일요일 데이터는 위 형식으로 추가하세요
};
const PX=1.6, START=17*60, END=27*60, H=(END-START)*PX;
const m=t=>{let[h,mi]=t.split(":").map(Number);if(h<17)h+=24;return h*60+mi};
let day=Object.keys(DAYS)[0];
let sel=JSON.parse(localStorage.getItem("edc26")||"{}"); // {day:[이름...]}
const get=()=>sel[day]||(sel[day]=DAYS[day].preset.slice());
const save=()=>localStorage.setItem("edc26",JSON.stringify(sel));
const all=()=>{const o=[];STAGES.forEach(s=>(DAYS[day][s[0]]||[]).forEach(a=>o.push({st:s,s:m(a[0]),e:m(a[1]),a0:a[0],a1:a[1],n:a[2]})));return o};

function render(){
  const D=DAYS[day],S=get(),items=all();
  document.getElementById("day").textContent=D.title;
  document.getElementById("tabs").innerHTML=Object.keys(DAYS).map(d=>`<button class="${d===day?"on":""}" data-d="${d}">${d}</button>`).join("");
  const mine=items.filter(i=>S.includes(i.n)).sort((a,b)=>a.s-b.s);
  const conf=new Set();
  mine.forEach((a,i)=>mine.slice(i+1).forEach(b=>{if(b.s<a.e&&a.s<b.e){conf.add(a.n);conf.add(b.n)}}));
  document.getElementById("cnt").textContent=`MY LINEUP · ${mine.length} ARTISTS`;
  let h=`<div></div>`+STAGES.map(s=>`<div class="hd" style="--c:${s[3]}">${s[1]}<b>${s[2]}</b></div>`).join("");
  let hrs="";for(let t=START;t<=END;t+=60)hrs+=`<div class="hr" style="top:${(t-START)*PX}px">${String(Math.floor(t/60)%24).padStart(2,"0")}:00</div>`;
  h+=`<div class="col" style="--H:${H}">${hrs}</div>`;
  STAGES.forEach(s=>{
    h+=`<div class="col" style="--H:${H};--c:${s[3]}">`+items.filter(i=>i.st===s).map(i=>
      `<div class="b ${S.includes(i.n)?"sel":""} ${conf.has(i.n)&&S.includes(i.n)?"conf":""}" data-n="${i.n}" style="top:${(i.s-START)*PX}px;height:${(i.e-i.s)*PX-2}px"><i>${i.a0}–${i.a1}</i><span>${i.n}</span></div>`).join("")+`</div>`;
  });
  document.getElementById("tt").innerHTML=h;
  document.getElementById("list").innerHTML=mine.length?mine.map(i=>{
    const c=mine.filter(o=>o!==i&&o.s<i.e&&i.s<o.e).map(o=>o.n);
    const q=encodeURIComponent(i.n.replace(/B[23]B/g," ")+" live set");
    return `<div class="it"><div class="t">${i.a0}–${i.a1}</div><div class="n">${i.n}<div class="s">${i.st[1]} ${i.st[2]}</div>${c.length?`<div class="warn">⚠ 겹침: ${c.join(", ")}</div>`:""}</div><a target="_blank" href="https://www.youtube.com/results?search_query=${q}">YouTube</a><a target="_blank" href="https://open.spotify.com/search/${encodeURIComponent(i.n)}">Spotify</a></div>`}).join(""):`<div class="empty">타임테이블에서 아티스트를 눌러 선택하세요.</div>`;
}
document.addEventListener("click",e=>{
  const b=e.target.closest(".b"),t=e.target.closest("[data-d]");
  if(t){day=t.dataset.d;render();return}
  if(b){const S=get(),n=b.dataset.n,i=S.indexOf(n);i>=0?S.splice(i,1):S.push(n);save();render()}
});
document.getElementById("pre").onclick=()=>{sel[day]=DAYS[day].preset.slice();save();render()};
document.getElementById("clr").onclick=()=>{sel[day]=[];save();render()};
render();
</script>
</body>
</html>
