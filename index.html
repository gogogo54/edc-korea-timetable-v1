<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#150f2a">
<title>EDC KOREA 2026 Timetable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--mu:#a29ec2;--disp:"Anton","Bebas Neue",Impact,"Arial Narrow",sans-serif;--body:"Space Grotesk","Pretendard","Noto Sans KR",-apple-system,sans-serif}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(70% 380px at 85% 0,#6a2a80aa,transparent),radial-gradient(60% 300px at 0 120px,#1d3a8a66,transparent),#150f2a;color:#fff;font-family:var(--body);min-height:100vh;padding:env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 24px)}
.hero{position:relative;height:230px;overflow:hidden;margin:10px 0 6px}
.bloom{position:absolute;right:-70px;top:-50px;width:310px;opacity:.85}
.big{position:absolute;left:0;top:-6px;font:400 150px/1.1 var(--disp);background:linear-gradient(180deg,#ffd23f 5%,#ff4f9a 60%,#b57cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.meta{position:absolute;left:150px;top:14px}
.meta b{display:block;font:400 46px/1 var(--disp);letter-spacing:2px}
.meta span{font-weight:700;font-size:16px;letter-spacing:3px;color:#ff9ec7}
.pills{position:absolute;left:0;bottom:6px;display:flex;gap:8px}
.pills em{font-style:normal;font-weight:700;font-size:13px;letter-spacing:1px;border:1.5px solid #fff9;border-radius:99px;padding:7px 14px}
.pills em.f{border:0;background:linear-gradient(90deg,#ff4f9a,#b57cff)}
.tabs{display:flex;gap:8px;margin:6px 0 14px}
.tabs button{flex:1;background:#ffffff14;color:#fff;border:1.5px solid #ffffff22;border-radius:12px;padding:10px;font:700 15px var(--body)}
.tabs button.on{background:linear-gradient(90deg,#ff4f9a,#b57cff);border-color:transparent}
.wrap{overflow-x:auto;margin:0 -12px;padding:0 12px}
.tt{display:grid;grid-template-columns:40px repeat(5,minmax(112px,1fr));gap:6px;min-width:660px}
.hd{padding-bottom:6px;border-bottom:4px solid var(--c);font-size:11px;font-weight:700;color:var(--mu);letter-spacing:1px}
.hd b{display:block;font:400 21px/1.1 var(--disp);color:var(--c);letter-spacing:.5px}
.ax{position:sticky;left:0;z-index:4;background:#150f2a}
.col{position:relative;height:calc(var(--H)*1px);background-image:linear-gradient(#ffffff0f 1px,transparent 1px)}
.hr{position:absolute;left:0;font-size:12px;font-weight:700;color:var(--mu);transform:translateY(-8px)}
.b{position:absolute;left:0;right:0;border-radius:12px;overflow:hidden;cursor:pointer;color:#fff;border:1.5px solid rgba(var(--rgb),.55);background:linear-gradient(160deg,rgba(var(--rgb),.38),rgba(var(--rgb),.1));-webkit-tap-highlight-color:transparent}
.b::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(var(--ang),#ffffff12 0 5px,transparent 5px 13px)}
.b img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.b.hasimg{background:#1a1733}
.b.hasimg::before{display:none}
.b.hasimg:not(.sel) img{opacity:.6}
.b.hasimg::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 25%,#0a081ee8)}
.mono{position:absolute;right:2px;bottom:-6px;font:400 58px/1 var(--disp);color:#fff;opacity:.15;pointer-events:none}
.hasimg .mono{display:none}
.tx{position:absolute;inset:8px 9px;z-index:2;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.tx i{font:700 13px var(--body);font-style:normal}
.tx span{font:400 18px/1.08 var(--disp);letter-spacing:.4px;text-transform:uppercase}
.ck{position:absolute;top:7px;right:7px;z-index:3;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--body);font-style:normal;background:#ffffff26;color:#fff}
.b.sel{background:linear-gradient(160deg,var(--c),rgba(var(--rgb),.7));color:#0d0a1f;border-color:#fff;box-shadow:0 0 20px rgba(var(--rgb),.75);z-index:2}
.b.sel::before{background:repeating-linear-gradient(var(--ang),#00000014 0 5px,transparent 5px 13px)}
.b.sel .mono{color:#0d0a1f;opacity:.18}
.b.sel .ck{background:#0d0a1f;color:var(--c)}
.b.sel.hasimg{color:#fff}
.b.sel.hasimg::after{background:linear-gradient(transparent 25%,rgba(var(--rgb),.92))}
.b.conf{outline:3px solid #ff3b3b;outline-offset:1px}
.panel{margin-top:20px;background:#ffffff10;border-radius:16px;padding:14px}
.panel h2{font:400 22px var(--disp);letter-spacing:1px;margin-bottom:8px}
.it{display:flex;align-items:center;gap:10px;padding:10px 0 10px 10px;border-top:1px solid #ffffff14;border-left:4px solid var(--c);margin-top:6px;border-radius:4px}
.it .t{color:var(--mu);width:100px;flex:none;font-weight:700;font-size:14px}
.it .n{flex:1;font:400 20px/1.1 var(--disp);letter-spacing:.4px}
.it .s{font:600 12px var(--body);color:var(--mu);margin-top:3px;letter-spacing:.5px}
.it a{color:#fff;background:#ffffff1c;border-radius:8px;padding:6px 9px;font-size:12px;font-weight:700;text-decoration:none}
.warn{color:#ff7b7b;font:600 13px var(--body);margin-top:3px}
.empty{color:var(--mu);font-size:14px;padding:6px 0}
.act{display:flex;gap:8px;margin-top:12px}
.act button{flex:1;background:#ffffff18;border:0;color:#fff;border-radius:10px;padding:11px;font:700 14px var(--body)}
#exp{background:linear-gradient(90deg,#ff4f9a,#b57cff)}
.ex{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:9;padding:12px}
.exb{background:#1e1838;border-radius:14px;padding:12px;max-width:420px;width:100%;max-height:95vh;display:flex;flex-direction:column;gap:10px}
.exo{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px}
.exo button{background:#ffffff18;color:#fff;border:0;border-radius:99px;padding:7px 12px;font-size:12px}
.exo button.on{background:#ff5c8a}
#pv{max-height:62vh;max-width:100%;object-fit:contain;align-self:center;border-radius:8px;min-height:80px}
</style>
</head>
<body>
<header class="hero" id="hero"></header>
<div class="tabs" id="tabs"></div>
<div class="wrap"><div class="tt" id="tt"></div></div>
<div class="panel">
  <h2>MY LINEUP</h2>
  <div id="list"></div>
  <div class="act"><button id="exp">이미지로 저장</button><button id="clr">전체 해제</button></div>
</div>
<div class="ex" id="ex"><div class="exb"><div class="exo"><button data-sz="1920" class="on">인스타 스토리 9:16</button><button data-sz="2280">폰 배경화면</button><label><input type="checkbox" id="ck"> 잠금화면 시계 자리 비우기</label></div><img id="pv" alt=""><div class="act"><button id="sv">저장 / 공유</button><button id="cl">닫기</button></div></div></div>
<script>
/* ===== 데이터 (공식 타임테이블) =====
   각 줄: "시작-종료 이름". 선택은 이름이 아니라 슬롯(요일+스테이지+순서) 단위라
   같은 DJ가 여러 번 나와도 각각 따로 선택됩니다.
   DJ 이미지: images/ 폴더에 이름을 소문자-하이픈으로 바꾼 파일을 넣으세요. (예: images/dj-snake.jpg)
   다른 확장자/외부 URL을 쓰려면 아래 IMG에 "이름":"주소"를 추가하세요. */
const IMG={};
const STAGES=[["k","kinetic","FIELD","#ffc933"],["c","circuit","GROUNDS","#33d6ff"],["s","stereo","BLOOM","#ff4f9a"],["j","bionic","JUNGLE","#7dff3a"],["a","boombox","ART CAR","#b57cff"]];
const DAYS=[
{key:"10.3 토",title:"SATURDAY · OCT 3",
k:`17:00-18:00 HOHO ONE
18:00-19:00 SUNGYOO
19:00-20:00 MUZIE
20:00-21:00 KREAM

22:00-23:07 R3HAB
23:12-00:27 SUBTRONICS

c:`17:00-18:15 ASHIKO

j:`17:00-18:15 ONE1

a:`17:00-18:15 HONGTON_E

22:00-23:15 SPACECOWBOY

{key:"10.4 일",title:"SUNDAY · OCT 4",
k:`17:00-18:00 4URA
18:00-19:00 SPECT
19:00-20:00 PLUKO
20:00-21:00 TOKIMONSTA
21:00-22:00 ARGY

c:`17:00-18:00 ELIANA

21:00-22:05 BOU

23:10-00:25 TROYBOI
00:25-01:40 NICO MORENO
01:45-03:00 WOOLI`,
s:`17:00-18:00 CASEPEAT X PURPLE RABBIT
18:00-19:00 KAGO PENGCHI
19:00-20:00 PAUL EUN
20:00-21:00 MATTY RALPH
21:00-22:15 ALY & FILA
22:15-23:30 MARIE VAUNT
23:30-00:45 COSMIC GATE
00:45-01:45 VINI VICI
01:45-03:00 NIFRA`,
j:`17:00-18:15 SORAERE BROCKEN
18:15-19:30 ZENA
19:30-20:45 ASTRO VOIZE
20:45-22:00 YOUNA
22:00-23:15 KAYZO
23:15-00:30 CHARLIE SPARKS
00:30-01:45 LILLY PALMER
01:45-03:00 999999999`,
a:`17:00-18:15 KYSS
18:15-19:30 HWAII
19:30-20:45 MULE
20:45-22:00 DJ HAO
22:00-23:15 KWON YEONSU
23:15-00:30 NAN AH
00:30-01:45 PONGPONG
01:45-03:00 KIANN`}
];
const $=id=>document.getElementById(id);
DAYS[0].num="03";DAYS[0].dow="SATURDAY";DAYS[1].num="04";DAYS[1].dow="SUNDAY";
const DISP='"Anton","Bebas Neue",Impact,"Arial Narrow",sans-serif',BODY='"Space Grotesk","Pretendard","Noto Sans KR",sans-serif';
const PX=2.2,START=17*60,END=27*60,H=(END-START)*PX;
const mm=t=>{let[h,m]=t.split(":").map(Number);if(h<17)h+=24;return h*60+m};
const slug=n=>n.replace(/Ø/g,"O").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
DAYS.forEach((d,di)=>{d.slots=[];STAGES.forEach(s=>d[s[0]].split("\n").forEach((l,i)=>{
  const m=l.match(/^(\d\d:\d\d)-(\d\d:\d\d) (.+)$/);
  d.slots.push({id:`${di}-${s[0]}-${i}`,st:s,a0:m[1],a1:m[2],s:mm(m[1]),e:mm(m[2]),n:m[3]});
}))});
const rgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const rgba=(h,a)=>`rgba(${rgb(h)},${a})`;
const hash=n=>[...n].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
const mono=n=>n.replace(/[^A-Z0-9Ø ]/gi,"").split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("")||n[0];
let di=0,sel=[];
try{sel=JSON.parse(localStorage.getItem("edc26v2"))}catch(e){}
if(!Array.isArray(sel))sel=[];
const save=()=>{try{localStorage.setItem("edc26v2",JSON.stringify(sel))}catch(e){}};
const imgSrc=n=>IMG[n]||`images/${slug(n)}.jpg`;
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const bloomSVG=()=>{let p="";for(let i=0;i<12;i++)p+=`<ellipse cy="-58" rx="17" ry="44" fill="${STAGES[i%5][3]}" opacity=".5" transform="rotate(${i*30})"/>`;
  return `<svg class="bloom" viewBox="-110 -110 220 220"><g style="mix-blend-mode:screen">${p}</g><circle r="22" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2"/><circle r="8" fill="#fff" fill-opacity=".85"/></svg>`};

function render(){
  const D=DAYS[di];
  const mine=D.slots.filter(s=>sel.includes(s.id)).sort((a,b)=>a.s-b.s);
  const conf=new Set();
  mine.forEach((a,i)=>mine.slice(i+1).forEach(b=>{if(b.s<a.e&&a.s<b.e){conf.add(a.id);conf.add(b.id)}}));
  $("hero").innerHTML=bloomSVG()+`<div class="big">${D.num}</div><div class="meta"><b>OCT</b><span>${D.dow}</span></div><div class="pills"><em>EDC KOREA 2026</em><em class="f">MY LINEUP · ${mine.length}</em></div>`;
  $("tabs").innerHTML=DAYS.map((d,i)=>`<button class="${i===di?"on":""}" data-d="${i}">${d.key}</button>`).join("");
  let hrs="";for(let t=START;t<=END;t+=60)hrs+=`<div class="hr" style="top:${(t-START)*PX}px">${String(Math.floor(t/60)%24).padStart(2,"0")}:00</div>`;
  let h=`<div class="ax"></div>`+STAGES.map(s=>`<div class="hd" style="--c:${s[3]}">${s[1]}<b>${s[2]}</b></div>`).join("")+`<div class="col ax" style="--H:${H};background-image:none">${hrs}</div>`;
  STAGES.forEach(s=>{
    h+=`<div class="col" style="--H:${H};--c:${s[3]};--rgb:${rgb(s[3])};background-size:100% ${60*PX}px">`+D.slots.filter(x=>x.st===s).map(x=>{
      const on=sel.includes(x.id);
      return `<div class="b hasimg${on?" sel":""}${on&&conf.has(x.id)?" conf":""}" data-id="${x.id}" style="top:${(x.s-START)*PX}px;height:${(x.e-x.s)*PX-3}px;--ang:${hash(x.n)%2?45:-45}deg"><img src="${imgSrc(x.n)}" alt="" loading="lazy" onerror="this.parentNode.classList.remove('hasimg');this.remove()"><span class="mono">${esc(mono(x.n))}</span><div class="tx"><i>${x.a0}–${x.a1}</i><span>${esc(x.n)}</span></div><em class="ck">${on?"✓":"+"}</em></div>`}).join("")+"</div>";
  });
  $("tt").innerHTML=h;
  $("list").innerHTML=mine.length?mine.map(x=>{
    const c=mine.filter(o=>o!==x&&o.s<x.e&&x.s<o.e).map(o=>o.n);
    const q=encodeURIComponent(x.n.replace(/B[23]B| X /g," ")+" live set");
    return `<div class="it" style="--c:${x.st[3]}"><div class="t">${x.a0}–${x.a1}</div><div class="n">${esc(x.n)}<div class="s">${x.st[1]} ${x.st[2]}</div>${c.length?`<div class="warn">⚠ 겹침: ${esc(c.join(", "))}</div>`:""}</div><a target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${q}">YouTube</a><a target="_blank" rel="noopener" href="https://open.spotify.com/search/${encodeURIComponent(x.n)}">Spotify</a></div>`}).join(""):`<div class="empty">타임테이블에서 아티스트를 눌러 선택하세요.</div>`;
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-d]"),b=e.target.closest(".b");
  if(t){di=+t.dataset.d;render();return}
  if(b){const i=sel.indexOf(b.dataset.id);i>=0?sel.splice(i,1):sel.push(b.dataset.id);save();render()}
});
$("clr").onclick=()=>{const ids=DAYS[di].slots.map(s=>s.id);sel=sel.filter(i=>!ids.includes(i));save();render()};

/* ===== 이미지 저장 (캔버스) ===== */
let ex={size:1920,clock:false},exBlob,exURL;
const loadImg=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);setTimeout(()=>r(null),4000);i.src=src});
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function wrap(c,t,w){const L=[];let l="";t.split(" ").forEach(x=>{const y=l?l+" "+x:x;if(c.measureText(y).width>w&&l){L.push(l);l=x}else l=y});L.push(l);return L}
function bloomC(c,cx,cy,r){c.save();c.translate(cx,cy);c.globalCompositeOperation="lighter";c.globalAlpha=.4;
  for(let i=0;i<12;i++){c.save();c.rotate(i*Math.PI/6);c.fillStyle=STAGES[i%5][3];c.beginPath();c.ellipse(0,-r*.53,r*.155,r*.4,0,0,7);c.fill();c.restore()}
  c.globalAlpha=.6;c.strokeStyle="#fff";c.lineWidth=3;c.beginPath();c.arc(0,0,r*.2,0,7);c.stroke();c.fillStyle="#fff";c.beginPath();c.arc(0,0,r*.07,0,7);c.fill();c.restore()}
async function draw(){
  try{await Promise.all([document.fonts.load(`400 40px ${DISP}`),document.fonts.load(`700 20px ${BODY}`)])}catch(e){}
  const D=DAYS[di],W=1080,HH=ex.size,cv=document.createElement("canvas");cv.width=W;cv.height=HH;const c=cv.getContext("2d");
  const imgs={};await Promise.all([...new Set(D.slots.map(s=>s.n))].map(async n=>{imgs[n]=await loadImg(imgSrc(n))}));
  c.fillStyle="#150f2a";c.fillRect(0,0,W,HH);
  let g=c.createRadialGradient(W*.85,0,0,W*.85,0,700);g.addColorStop(0,"rgba(106,42,128,.7)");g.addColorStop(1,"rgba(106,42,128,0)");c.fillStyle=g;c.fillRect(0,0,W,HH);
  const mine=D.slots.filter(s=>sel.includes(s.id)),y0=ex.clock?400:60;
  bloomC(c,W-150,y0+105,235);
  c.textAlign="left";c.font=`400 270px ${DISP}`;
  g=c.createLinearGradient(0,y0,0,y0+250);g.addColorStop(0,"#ffd23f");g.addColorStop(.6,"#ff4f9a");g.addColorStop(1,"#b57cff");c.fillStyle=g;c.fillText(D.num,40,y0+245);
  const nw=c.measureText(D.num).width;
  c.fillStyle="#fff";c.font=`400 88px ${DISP}`;c.fillText("OCT",40+nw+28,y0+110);
  c.fillStyle="#ff9ec7";c.font=`700 34px ${BODY}`;c.fillText(D.dow,40+nw+30,y0+160);
  c.font=`700 24px ${BODY}`;const t1="EDC KOREA 2026",t2=`MY LINEUP · ${mine.length}`,py=y0+272,ph=50,w1=c.measureText(t1).width+44,w2=c.measureText(t2).width+44;
  rr(c,40,py,w1,ph,25);c.strokeStyle="rgba(255,255,255,.6)";c.lineWidth=2;c.stroke();c.fillStyle="#fff";c.fillText(t1,62,py+33);
  g=c.createLinearGradient(40+w1+12,0,40+w1+12+w2,0);g.addColorStop(0,"#ff4f9a");g.addColorStop(1,"#b57cff");rr(c,40+w1+12,py,w2,ph,25);c.fillStyle=g;c.fill();c.fillStyle="#fff";c.fillText(t2,62+w1+12,py+33);
  const hy=py+ph+40,gy=hy+68,gb=HH-50,ppm=(gb-gy)/600,x0=66,cw=(W-16-x0-24)/5;
  c.textAlign="right";c.fillStyle="#a29ec2";c.font=`700 19px ${BODY}`;
  for(let t=START;t<=END;t+=60)c.fillText(String(Math.floor(t/60)%24).padStart(2,"0")+":00",x0-10,gy+(t-START)*ppm+7);
  STAGES.forEach((st,i)=>{
    const bx=x0+i*(cw+6),col=st[3];
    c.textAlign="left";c.fillStyle="#a29ec2";c.font=`700 17px ${BODY}`;c.fillText(st[1],bx,hy);
    c.fillStyle=col;c.font=`400 32px ${DISP}`;c.fillText(st[2],bx,hy+34);c.fillRect(bx,hy+46,cw,5);
    D.slots.filter(x=>x.st===st).forEach(sl=>{
      const on=sel.includes(sl.id),im=imgs[sl.n],by=gy+(sl.s-START)*ppm,bh=(sl.e-sl.s)*ppm-5;
      if(on){c.save();c.shadowColor=col;c.shadowBlur=26;rr(c,bx,by,cw,bh,14);c.fillStyle=col;c.fill();c.restore()}
      c.save();rr(c,bx,by,cw,bh,14);c.clip();
      if(im){const k=Math.max(cw/im.width,bh/im.height);c.drawImage(im,bx+(cw-im.width*k)/2,by+(bh-im.height*k)/2,im.width*k,im.height*k);
        if(!on){c.fillStyle="rgba(10,8,30,.35)";c.fillRect(bx,by,cw,bh)}
        g=c.createLinearGradient(0,by,0,by+bh);g.addColorStop(.25,"rgba(0,0,0,0)");g.addColorStop(1,on?rgba(col,.92):"rgba(10,8,30,.92)");c.fillStyle=g;c.fillRect(bx,by,cw,bh);
      }else{
        g=c.createLinearGradient(0,by,0,by+bh);g.addColorStop(0,on?col:rgba(col,.38));g.addColorStop(1,on?rgba(col,.72):rgba(col,.1));c.fillStyle=g;c.fillRect(bx,by,cw,bh);
        c.strokeStyle=on?"rgba(0,0,0,.08)":"rgba(255,255,255,.07)";c.lineWidth=5;const fl=hash(sl.n)%2;
        for(let k=-bh;k<cw+bh;k+=18){c.beginPath();c.moveTo(bx+k+(fl?bh:0),by);c.lineTo(bx+k+(fl?0:bh),by+bh);c.stroke()}
        c.textAlign="right";c.font=`400 ${Math.min(bh*.7,110)}px ${DISP}`;c.fillStyle=on?"rgba(13,10,31,.18)":"rgba(255,255,255,.11)";c.fillText(mono(sl.n),bx+cw-6,by+bh-2);
      }
      c.restore();
      rr(c,bx+1.5,by+1.5,cw-3,bh-3,13);c.strokeStyle=on?"#fff":rgba(col,.55);c.lineWidth=on?3:2;c.stroke();
      const tc=on&&!im?"#0d0a1f":"#fff";
      c.textAlign="left";c.fillStyle=tc;c.shadowColor="#000";c.shadowBlur=im?6:0;
      c.font=`700 22px ${BODY}`;c.fillText(`${sl.a0}–${sl.a1}`,bx+12,by+32);
      let fs=32,L;for(;fs>=17;fs-=2){c.font=`400 ${fs}px ${DISP}`;L=wrap(c,sl.n,cw-24);if(L.length*(fs+4)+54<=bh)break}
      L.forEach((t,k)=>c.fillText(t,bx+12,by+bh-14-(L.length-1-k)*(fs+4)));
      c.shadowBlur=0;
      const cx=bx+cw-22,cy=by+23;c.beginPath();c.arc(cx,cy,15,0,7);c.fillStyle=on?"#0d0a1f":"rgba(255,255,255,.2)";c.fill();
      c.strokeStyle=on?col:"#fff";c.lineWidth=3;c.lineCap="round";c.lineJoin="round";c.beginPath();
      if(on){c.moveTo(cx-6,cy);c.lineTo(cx-2,cy+5);c.lineTo(cx+6,cy-5)}else{c.moveTo(cx-6,cy);c.lineTo(cx+6,cy);c.moveTo(cx,cy-6);c.lineTo(cx,cy+6)}
      c.stroke();
    });
  });
  return cv;
}
async function refresh(){
  const cv=await draw();
  exBlob=await new Promise(r=>cv.toBlob(r,"image/png"));
  if(exURL)URL.revokeObjectURL(exURL);
  exURL=URL.createObjectURL(exBlob);$("pv").src=exURL;
}
$("exp").onclick=()=>{$("ex").style.display="flex";refresh()};
$("cl").onclick=()=>{$("ex").style.display="none"};
$("ck").onchange=e=>{ex.clock=e.target.checked;refresh()};
document.querySelectorAll("[data-sz]").forEach(b=>b.onclick=()=>{ex.size=+b.dataset.sz;ex.clock=ex.size===2280;$("ck").checked=ex.clock;document.querySelectorAll("[data-sz]").forEach(x=>x.classList.toggle("on",x===b));refresh()});
$("sv").onclick=async()=>{
  if(!exBlob)return;
  const f=new File([exBlob],`edc-korea-2026-${DAYS[di].key.split(" ")[0]}.png`,{type:"image/png"});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return}catch(e){if(e.name==="AbortError")return}}
  const a=document.createElement("a");a.href=exURL;a.download=f.name;a.click();
};
